[project]
name = "mcp-org"
version = "0.4.0"
description = "Enterprise MCP scaffold: gateway, auth middleware, RBAC, rate limiting, audit logging, and deployment patterns for private org MCP servers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sarat Jogavajjala" }]
dependencies = [
    "mcp>=1.9,<3",
    "structlog>=24.1",
    "httpx>=0.27",
    "PyJWT>=2.8",
    "cryptography>=42",
    "anthropic>=0.40",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[project.scripts]
mcp-org-gateway = "mcp_org.gateway:main"
mcp-org-proxy = "mcp_org.proxy:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.10",
    "bandit>=1.7",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_org"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
